name: Synchroniser le catalogue
# Toutes les 10 minutes : Google Sheets → catalogue.json (le site s'ouvre ainsi partout,
# même quand Google est bloqué ou lent chez le visiteur).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    paths: ["assets/js/config.js"]
permissions:
  contents: write
concurrency:
  group: sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/scripts/sync.mjs
      - name: Enregistrer
        run: |
          git config user.name "zenvora-bot"
          git config user.email "bot@users.noreply.github.com"
          git add catalogue.json assets/uploads 2>/dev/null || true
          if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
          git commit -m "Catalogue synchronisé depuis Google Sheets"
          git pull --rebase origin main && git push
